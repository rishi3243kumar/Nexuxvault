name: VeilPass CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Build & Verify Compact Circuits + Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Project Dependencies
        run: npm ci || npm install

      - name: Compile Midnight Compact Smart Contracts
        run: npm run compile:contract

      - name: Run Vitest Unit & Circuit Test Suite
        run: npm test

      - name: Verify Web Frontend Production Build
        run: npm run build
